# Render Blueprint — one-click deployment.
# In the Render dashboard, use "Blueprints" (dashboard.render.com/blueprints),
# not the main "New +" button, and point it at this repository.
#
# This creates both the web service and the database in one step, wires
# DATABASE_URL between them automatically, and generates AUTH_SECRET for
# you. See DEPLOYMENT.md for what happens after — the handful of values
# you still need to fill in by hand, and the full launch checklist.

services:
  - type: web
    name: ecoskills-academy
    runtime: node
    plan: free
    # The repo has no prisma/migrations folder, so `prisma migrate deploy`
    # had nothing to apply and never created the tables. `db push` syncs the
    # database to prisma/schema.prisma on every deploy and refuses changes
    # that would lose data (see DEPLOYMENT.md, section 5).
    buildCommand: npm install && npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecoskills-academy-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # These three are deployment-specific — Render will prompt you for
      # them when you create the Blueprint, rather than committing them to
      # the repo. See DEPLOYMENT.md section 2 for what each one is.
      - key: APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Course media storage (video/audio/documents). Render's free web
      # services have no persistent disk, so production needs an
      # S3-compatible bucket such as Cloudflare R2. See ENVIRONMENT.md.
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_REGION
        value: auto

databases:
  - name: ecoskills-academy-db
    plan: free
    databaseName: ecoskills_academy
    user: ecoskills
